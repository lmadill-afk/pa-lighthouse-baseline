name: Weekly Lighthouse (PSI API)

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 09:00 Central (14:00 UTC; 15:00 during CST)
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per page/device"
        default: "3"
      site_version:
        description: "v1 or v2"
        default: "v1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python scripts/psi_collect.py --runs "${{ github.event.inputs.runs || '3' }}" --site-version "${{ github.event.inputs.site_version || 'v1' }}"
      - name: Commit
        run: |
          git config user.name "lighthouse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.csv dashboard.html
          git diff --cached --quiet || git commit -m "lighthouse: $(date -u +%Y-%m-%d)"
          git push
